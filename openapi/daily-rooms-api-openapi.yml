      - bearerAuth: []
  /rooms/{room_name}/transcription/update:
    post:
      summary: rooms/:name/transcription/update
      description: Update the set of participants being transcribed
      operationId: RoomTranscriptionUpdate
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                instanceId:
                  type: string
                  description: instanceId to be updated.
                participants:
                  description: A list of participant IDs to be transcribed. Only the participant IDs included in this array will be processed
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    sent: 'true'
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/transcription/stop:
    post:
      summary: rooms/:name/transcription/stop
      description: Stop a transcription in a room
      operationId: RoomTranscriptionStop
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                instanceId:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    sent: 'true'
        '400':
