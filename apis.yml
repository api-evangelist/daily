aid: daily
name: Daily
description: Daily is a Y Combinator-backed developer platform providing real-time audio and video
  APIs and client SDKs for embedding WebRTC video calls, live streaming, cloud recording,
  transcription, and SIP/PSTN telephony into web, mobile, and server applications. Its REST API
  manages rooms, meeting tokens, recordings, transcripts, webhooks, phone numbers, and domain
  configuration, complemented by the daily-js, daily-react, and native iOS/Android/Python/Flutter
  SDKs plus the embeddable Daily Prebuilt UI. Authentication uses a domain-scoped API key sent as
  an HTTP Bearer token.
