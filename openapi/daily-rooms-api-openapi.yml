          content:
            application/json:
              examples:
                Result:
                  value:
                    sent: 'true'
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/live-streaming/stop:
    post:
      summary: rooms/:name/live-streaming/stop
      description: Stop a live stream in a room
      operationId: RoomLivestreamingStop
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    sent: 'true'
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/transcription/start:
    post:
      summary: rooms/:name/transcription/start
      description: Start a transcription in a room
      operationId: RoomTranscriptionStart
      parameters:
      - name: room_name
        in: path
