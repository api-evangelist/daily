      - bearerAuth: []
  /rooms/{room_name}/dialOut/start:
    post:
      summary: rooms/:name/dialOut/start
      description: Start a dial-out in a room
      operationId: RoomDialOutStart
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dialout-properties'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    ok: 'true'
                    sessionId: UUID of the dial-out session
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/dialOut/sendDTMF:
    post:
      summary: rooms/:name/dialOut/sendDTMF
      description: send DTMF digits on the dialout
      operationId: RoomDialOutSendDTMF
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                sessionId:
                  type: string
                  description: The participant ID of the dialOut session
                tones:
                  type: string
                  description: Combined string of DTMF tones to send (e.g., "1234#"). Maximum 20 characters.
                digitDurationMs:
                  type: integer
                  description: Duration in milliseconds, represents the duration between each DTMF digit. Must be between 50 and 2000. The default duration is 500ms.
                  minimum: 50
                  maximum: 2000
              required:
              - sessionId
              - tones
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    ok: 'true'
                    sessionId: UUID of the dial-out session
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/dialOut/stop:
    post:
      summary: rooms/:name/dialOut/stop
      description: Stop a dial out in a room
      operationId: RoomDialOutStop
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
