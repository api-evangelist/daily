          application/json:
            schema:
              $ref: '#/components/schemas/RecordingStreamingOptions'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: sent
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/recordings/update:
    post:
      summary: rooms/:name/recordings/update
      description: Update a recording in a room
      operationId: RoomRecordingsUpdate
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyStreamingOptions'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: sent
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/recordings/stop:
    post:
      summary: rooms/:name/recordings/stop
      description: Stop a recording in a room
      operationId: RoomRecordingsStop
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: sent
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/live-streaming/start:
    post:
      summary: rooms/:name/live-streaming/start
      description: Start a live stream in a room
      operationId: RoomLivestreamingStart
      parameters:
      - name: room_name
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyLiveStreamingOptions'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    sent: 'true'
        '400':
          $ref: '#/components/responses/400'
      deprecated: false
      tags:
      - rooms
      security:
      - bearerAuth: []
  /rooms/{room_name}/live-streaming/update:
    post:
      summary: rooms/:name/live-streaming/update
      description: Update a live stream in a room
      operationId: RoomLivestreamingUpdate
      parameters:
